<!DOCTYPE html>
<html dir="">
<head>
    <meta charset="UTF-8">
    <title>Position Voucher A 3.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            width: 100vw; 
            height: 100vh; 
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Large Portrait Image ("Present") */
        .kol-logo-present {
            position: absolute;
            width: 1416px;
            height: 1416px;
            left: 1992px;
            top: 300px;
            object-fit: cover;
            z-index: 2;
        }

        /* YUBIT X KOL Header (Twitter Only) */
        .twitter-header {
            position: absolute;
            left: 153px;
            top: 126px;
            width: 2628px;
            height: 288px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px; /* Scaled from 5px */
            z-index: 3;
        }

        .header-yubit-logo {
            width: 825px; /* Scaled from 275px */
            height: 276px; /* Scaled from 92px */
            object-fit: contain;
            flex: none;
        }

        .header-cross-css {
            position: relative;
            width: 108.09px;
            height: 108.27px;
            flex: none;
        }

        .cross-line-1 {
            position: absolute;
            width: 2.7px;
            height: 108.27px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, #FFFFFF 47.76%, rgba(255, 255, 255, 0) 100%);
        }

        .cross-line-2 {
            position: absolute;
            width: 2.7px;
            height: 108.09px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, #FFFFFF 47.76%, rgba(255, 255, 255, 0) 100%);
        }

        .header-kol-logo {
            width: 258px; /* Scaled from 86px */
            height: 258px; /* Scaled from 86px */
            border-radius: 50%;
            object-fit: cover;
            background-color: #000;
            flex: none;
        }

        .header-kol-name {
            font-weight: 700;
            font-size: 120px; /* Scaled from 40px */
            line-height: 138px; /* Scaled from 46px */
            color: #FFFFFF;
            font-variant: all-small-caps;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        /* VIP Upgrade Container */
        .v3-vip-container {
            position: absolute;
            left: 138px;
            top: 1209px;
            width: max-content;
            height: 195px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 28px 69px;
            gap: 37px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 45.19%, #1F0900 90.87%);
            border-radius: 232px;
            box-sizing: border-box;
            z-index: 4;
        }

        .diamond-icon {
            width: 135px;
            height: 135px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .vip-text-content {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 90px;
            line-height: 135px;
            color: #FFFFFF;
            white-space: nowrap;
        }

        .vip-gold {
            color: #FF6F00;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <img src="" class="background-layer" alt="Background">

    <!-- Big KOL Portrait ("Present") -->

    <!-- Header specifically for Twitter -->
    <div class="twitter-header">
        <img src="" class="header-yubit-logo" alt="YUBIT">
        <div class="header-cross-css">
            <div class="cross-line-1"></div>
            <div class="cross-line-2"></div>
        </div>
            <div class="header-kol-name">CHENTO</div>
    </div>

    <!-- VIP Banner -->
        <div class="v3-vip-container">
                <img src="data:image/png;base64,xxxx" class="diamond-icon" alt="VIP">
            <div class="vip-text-content">
                INSTANT VIP 2 UPGRADE
            </div>
        </div>
    
    <script>
        document.fonts.ready.then(() => {
            const kolName = document.querySelector('.header-kol-name');
            if (kolName) {
                let currentFontSize = 120; 
                const minFontSize = 60;
                // maximum width for the name field
                const maxWidth = 1755; 
                
                kolName.style.fontSize = currentFontSize + 'px';
                
                while (kolName.scrollWidth > maxWidth && currentFontSize > minFontSize) {
                    currentFontSize -= 2; 
                    kolName.style.fontSize = currentFontSize + 'px';
                }
            }
        });
    </script>
</body>
</html>
